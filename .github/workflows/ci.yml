name: ci
on:
  push: { branches: [master] }
  pull_request:
permissions:
  contents: read
  packages: read
jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact -v
  db-selftests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with: { version: 2.67.1 }
      - name: log in to ghcr.io (authenticated pulls avoid anonymous rate limits)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: "start db and apply all migrations (retries on registry rate limits)"
        run: |
          for i in 1 2 3 4 5 6; do
            if supabase db start; then exit 0; fi
            echo "db start attempt $i failed; backing off $((i*20))s"; supabase stop --no-backup || true; sleep $((i*20))
          done
          exit 1
      - name: load reference seed (idempotent; ON CONFLICT DO NOTHING)
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: run selftests
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -A -t -v ON_ERROR_STOP=1 \
            -f scripts/sql/selftests_all_v1.sql | tee selftests.txt
          if grep -E 'PROTEUSOPS_[A-Z_]+_FAIL($|[^A-Z_])' selftests.txt; then echo "SELFTEST FAILURE"; exit 1; fi
          test "$(grep -cE '^PROTEUSOPS_[A-Z_]+_OK$' selftests.txt)" -ge 21
      - name: deployment-pod pipeline audit (every pods* selftest/verify must PASS)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f scripts/sql/pod_pipeline_audit_v1.sql | tee pod_audit.txt
          grep -q 'POD_AUDIT_NON_PASS_COUNT=0$' pod_audit.txt || { echo "POD AUDIT FAILURE"; sed -n '/POD_AUDIT_NON_PASS/,/POD_AUDIT_PASS/p' pod_audit.txt; exit 1; }
          grep -qE 'POD_AUDIT_TOTAL=([5-9][0-9]|[1-9][0-9]{2,})' pod_audit.txt || { echo "POD AUDIT RAN TOO FEW FUNCTIONS"; exit 1; }
